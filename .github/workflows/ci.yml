name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Astro 7 requires Node >=22.12.0; Node 20 exits before the check runs.
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps
        run: npm ci
      - name: Lint (Biome + ESLint, library)
        run: npm run lint
      - name: Typecheck (astro check, all workspaces)
        run: npm run check
      - name: Unit + contract + demo tests
        run: npm test
      - name: Build docs site (SSR proof)
        run: npm run build
      - name: Verify published tarball
        run: npm run check:pack

  # The peer range is >=7.0.0 <8.0.0; pin the oldest supported minor and the
  # current dev version so a 7.x release cannot silently break the floor.
  astro-peer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astro: [ "7.0.0", "7.4.1" ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps
        run: npm ci
      - name: Pin Astro ${{ matrix.astro }}
        run: npm install --no-save astro@${{ matrix.astro }}
      - name: Typecheck against pinned Astro
        run: npx astro check
      - name: Library tests against pinned Astro
        run: npx vitest run
