name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Astro 7 requires Node >=22.12.0; Node 20 exits before the check runs.
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps
        run: npm ci
      - name: Lint (Biome + ESLint, library)
        run: npm run lint
      - name: Typecheck (astro check, all workspaces)
        run: npm run check
      - name: Unit + contract + demo tests
        run: npm test
      - name: Build docs site (SSR proof)
        run: npm run build
